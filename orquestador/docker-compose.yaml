# Camunda 8.9 (Zeebe + Operate + Tasklist) en un solo contenedor, con H2 en archivo.
# Basado en el docker-compose oficial de camunda-distributions (tag docker-compose-8.9),
# reducido a lo que necesita la demo. Solo para desarrollo local.
services:
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.9.22}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.9.22}
    container_name: orchestration
    ports:
      - "0.0.0.0:26500:26500"   # gateway gRPC (workers, desde otras laptops)
      - "0.0.0.0:8080:8080"     # Operate / Tasklist / API REST
      - "127.0.0.1:9600:9600"   # health (solo local)
    mem_limit: 1536m
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 2s
      retries: 60
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

volumes:
  camunda:
  camunda-data:

configs:
  orchestration-config:
    file: ./configuration/application-h2.yaml
